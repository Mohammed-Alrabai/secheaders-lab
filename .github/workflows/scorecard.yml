name: Scorecard

# ADR-049: OpenSSF Scorecard supply-chain checks, published for the README badge and
# uploaded to code scanning. The action's own rules apply: no workflow-level write
# permissions, no job-level env, and only approved actions in the job.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

# SC-36: read-only by default.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Upload the SARIF results to code scanning.
      security-events: write
      # OIDC token that authenticates the published results (publish_results: true).
      id-token: write
    steps:
      # SC-33: every action pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
